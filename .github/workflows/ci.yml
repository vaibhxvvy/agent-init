name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node --check bin/agent-init.mjs
      - run: node --check scripts/agent-init.mjs
      - run: node scripts/agent-init.mjs --project /tmp/agent-init-ci --name ci --dry-run
      - run: grep -rn "{{" templates/project --include="*.md" | grep -v "{{PLACEHOLDER" | grep -v "{{GOAL" | grep -v "{{PERSONA" | grep -v "{{" || true
